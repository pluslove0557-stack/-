{% extends "base.html" %}
{% block title %}GPT 상품명 다듬기 프롬프트{% endblock %}
{% block content %}
<h1>GPT 상품명·태그 다듬기 프롬프트</h1>
<p class="lead">ChatGPT나 Claude에 붙여넣으세요. 결과 상품명/태그는 각 상품 화면에 붙여넣고 저장하면 엑셀에 반영됩니다.</p>
<textarea id="p" rows="24">{{ prompt }}</textarea>
<div class="toolbar"><button class="btn btn-primary" data-copy="p">복사</button><a class="btn" href="{{ url_for('us.candidates') }}">목록으로</a></div>
{% endblock %}
