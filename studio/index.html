<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>딸깍 스튜디오</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='16' width='64' height='64' fill='%23c4511a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='white' font-family='sans-serif'%3E딸%3C/text%3E%3C/svg%3E" />
<style>
:root{--paper:#f6f1e7;--ink:#241c16;--clay:#c4511a;--pine:#1f6b45;--navy:#1e3a56;--line:#e3d5c4;--card:#fffdf8;--muted:#65584e;--danger:#9f1d1d;--gold:#8a5a12;--amber:#fef3c7;--amber-line:#fcd34d}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Segoe UI",sans-serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--paper)}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.layout{display:flex;min-height:100vh}
aside{width:250px;background:#fffaf3;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:20px 12px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 16px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--clay);color:#fff;font-weight:700;font-size:21px;display:grid;place-items:center}
.brand b{display:block;font-size:20px;line-height:1.2}.brand span{font-size:14px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;border:0;background:none;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
nav button:hover{background:#fff}nav button.on{background:var(--clay);color:#fff}
.main{flex:1;min-width:0}
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 32px;background:rgba(246,241,231,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
header.top p{color:var(--muted)}
.mode{display:flex;align-items:center;gap:8px}.mode span{font-size:15px;color:var(--muted)}
main{max-width:1000px;margin:0 auto;padding:24px 32px 40px}
footer{max-width:1000px;margin:0 auto;padding:0 32px 40px;color:var(--muted);font-size:14px}
h1{font-size:30px;line-height:1.25}h2{font-size:24px;margin:8px 0}
.lead{color:var(--muted);margin:6px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card.warn{background:var(--amber);border-color:var(--amber-line)}
.card.err{background:#fef2f2;border-color:#fecaca;color:var(--danger);font-weight:700}
.card.ok{background:#ecf6ef;border-color:#b9dcc6;color:var(--pine);font-weight:700}
label.f{display:block;margin-bottom:14px}label.f>b{display:block;margin-bottom:4px}label.f small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--clay);outline-offset:0}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--clay);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.pine{background:var(--pine)}.btn.navy{background:var(--navy)}.btn.danger{background:var(--danger)}.btn.sm{padding:6px 12px;font-size:15px}

.chip.hot{background:var(--clay)}.chip.good{background:var(--pine)}.chip.big{background:#6d3c93}

.pos{color:var(--pine);font-weight:700}.neg{color:var(--danger);font-weight:700}

canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#fff}

</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><span class="logo">딸</span><span><b>딸깍 스튜디오</b><span>쇼츠 · 글 · 카드</span></span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <p>한 번 누르면 쇼츠 대본, 스레드 글, 카드뉴스가 준비됩니다.</p>
      <div class="mode"><span id="aiLabel"></span><button class="btn sm" id="modeBtn"></button></div>
    </header>
    <main id="view"></main>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   딸깍 스튜디오 — 다시 만든 버전 (빌드 없이 index.html 하나로 동작)
   1) 상수·유틸  2) 금지어 검사  3) AI 호출  4) 예시(체험) 데이터
   5) 생성기  6) 유튜브 검색·점수  7) 저장소  8) 화면
   ============================================================ */

/* ---------- 1) 상수·유틸 ---------- */
const PARTNERS_NOTE = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.";
const FORTUNE_NOTE = "이 내용은 재미로 보는 운세입니다. 미래를 맞히는 것이 아니고, 재물·건강·연애의 결과를 약속하지 않습니다. 건강이 걱정되면 전문가와 상담하세요.";
const SYSTEM_PROMPT = `당신은 한국 40~60대 손님을 위한 쇼핑 콘텐츠 작가입니다.
건강기능식품과 일반 광고에서 금지되는 단정은 쓰지 않습니다.
치료, 완치, 예방, 특효, 100%, 부작용 없음, 최고, 1위, 무조건, 기적, 즉효, 효과 보장이라는 말은 쓰지 않습니다.
효과를 단정하지 말고 "도움이 될 수 있어요", "꾸준히 챙기는 분들이 많아요"처럼 순하게 씁니다.
출력은 설명 없이 JSON 하나만 보냅니다.`;

const PAGES = [
  ["ranking", "쇼츠 랭킹", "쇼츠 레퍼런스 랭킹"],
  ["script", "대본 생성", "대본 생성기"],
  ["threads", "스레드 글", "스레드 글 공장"],
  ["cards", "카드뉴스", "카드뉴스 생성기"],
  ["fortune", "운세 쇼츠", "운세 쇼츠 생성기"],
  ["studio", "쇼츠 설계", "AI 쇼츠 설계실"],
  ["margin", "마진 계산기", "마진 계산기"],
  ["settings", "설정", "설정"],
];
const PERIODS = [["48h", "48시간", 48], ["7d", "7일", 168], ["30d", "30일", 720], ["90d", "90일", 2160]];
const SORTS = [["viewsPerHour", "속도순"], ["engagement", "참여순"], ["viewsToSubscriber", "구독자 대비"], ["views", "조회수순"]];
const ANIMALS = ["쥐", "소", "호랑이", "토끼", "용", "뱀", "말", "양", "원숭이", "닭", "개", "돼지"];
const FORTUNE_TOPICS = ["재물", "건강", "연애", "총운"];
const FORTUNE_CUTS = [[3, "3컷 · 약 27초"], [4, "4컷 · 약 36초"], [5, "5컷 · 약 45초"]];
const CARD_THEMES = {
  warm:  { label: "따뜻한 종이", bg: "#F6E7D4", bg2: "#E7C8A4", ink: "#2A2118", muted: "#5C4A3A", accent: "#C4511A", chip: "#FFF8EF", footer: "#7A6454" },
  navy:  { label: "밤색 간판",   bg: "#1A2C40", bg2: "#2E4A68", ink: "#F7F1E6", muted: "#E4D5C0", accent: "#E2B15A", chip: "#24384F", footer: "#C4B39A" },
  green: { label: "숲속 메모",   bg: "#E5F0E4", bg2: "#B7D2B4", ink: "#163528", muted: "#2C4A3A", accent: "#1F6B45", chip: "#F5FBF4", footer: "#4E6B5A" },
};
const THRESH = { rising: 500, goodEngagement: 0.04, breakout: 2 };
const CARD_W = 1080, CARD_H = 1350;
const CANVAS_FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR",sans-serif';

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p = "id") => `${p}-${Math.random().toString(36).slice(2, 8)}${Date.now().toString(36).slice(-3)}`;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const str = (v, d = "") => (typeof v === "string" ? v.trim() : d);
const strArr = (v) => (Array.isArray(v) ? v.map((x) => str(x)).filter(Boolean) : []);
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
const tagify = (arr) => strArr(arr).map((t) => (t.startsWith("#") ? t : `#${t}`));
const num = (v) => { const n = Number(v ?? 0); return Number.isFinite(n) ? n : 0; };
const fmtNum = (n) => Math.abs(n) >= 1e4 ? `${(n / 1e4).toFixed(Math.abs(n / 1e4) >= 100 ? 0 : 1)}만` : Math.round(n).toLocaleString("ko-KR");
const fmtPct = (n) => `${(n * 100).toFixed(1)}%`;
const fmtWon = (n) => `${Math.round(n).toLocaleString("ko-KR")}원`;
const fmtAge = (h) => (!Number.isFinite(h) || h < 48 ? `${Math.max(1, Math.round(h || 1))}시간 전` : `${Math.max(1, Math.round(h / 24))}일 전`);

function withNote(text, hasLink) {
  if (!hasLink || text.includes("쿠팡 파트너스 활동의 일환")) return text;
  const t = text.trim();
  return t ? `${t}\n\n${PARTNERS_NOTE}` : PARTNERS_NOTE;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- 2) 금지어 검사 ---------- */
const DEFAULT_BANNED = ["부작용이 없", "부작용 없어요", "부작용 없음", "즉각적인 효과", "의학적 효과", "완전 치유", "질병 치료", "의사 추천", "유일무이", "살 빠짐", "특효약", "100%", "완치", "완쾌", "특효", "즉효", "예방", "치료", "항암", "최고", "1위", "무조건", "기적", "약효", "효과 보장", "보장합니다"];
const SOFT = { "부작용이 없": "개인차가 있", "부작용 없어요": "사람마다 달라요", "부작용 없음": "개인차가 있음", "즉각적인 효과": "꾸준한 습관", "의학적 효과": "생활 습관", "완전 치유": "마음 관리", "질병 치료": "컨디션 관리", "의사 추천": "주변 이야기", "유일무이": "흔치 않은", "살 빠짐": "체중 관리", "특효약": "건강식품", "100%": "상당수", "완치": "회복 느낌", "완쾌": "개운함", "특효": "화제", "즉효": "빠른 체감", "예방": "관리", "치료": "케어", "항암": "몸 관리", "최고": "인기", "1위": "상위", "무조건": "일단", "기적": "변화", "약효": "체감", "효과 보장": "바람", "보장합니다": "기대할 수 있어요" };
/* 고치지 않는 키: 주소·날짜·상태처럼 글이 아닌 값 */
const SKIP_KEYS = new Set(["example", "createdAt", "id", "url", "link", "thumbnail", "savedAt", "status", "token", "provider", "referenceUrl", "channelId", "publishedAt", "platformLabel", "source", "disclaimer"]);

function isNoticeText(t) { return t.includes("쿠팡 파트너스 활동의 일환") || t.includes("재미로 보는 운세"); }
function dedupeWords(list) {
  const seen = new Set(), out = [];
  for (const w of list) { const t = w.trim(); if (t && !seen.has(t)) { seen.add(t); out.push(t); } }
  return out;
}
/* 긴 단어부터 찾고 겹치지 않게. "100%"가 "1100%" 안에서 걸리는 것은 피한다. */
function findBanned(text, words) {
  const sorted = dedupeWords(words).sort((a, b) => b.length - a.length || a.localeCompare(b));
  const used = new Array(text.length).fill(false), hits = [];
  for (const w of sorted) {
    let from = 0;
    while (from <= text.length - w.length) {
      const i = text.indexOf(w, from);
      if (i < 0) break;
      const end = i + w.length;
      const before = text[i - 1], after = text[end];
      const numericGuard = (/^\d/.test(w) && before && /\d/.test(before)) || (/%$/.test(w) && after && /\d/.test(after));
      if (!used.slice(i, end).some(Boolean) && !numericGuard) {
        for (let k = i; k < end; k++) used[k] = true;
        hits.push({ word: w, index: i, length: w.length });
      }
      from = i + 1;
    }
  }
  return hits.sort((a, b) => a.index - b.index);
}
function softenText(text, words) {
  if (isNoticeText(text)) return text;
  const hits = findBanned(text, words);
  if (!hits.length) return text;
  let out = "", pos = 0;
  for (const h of hits) { out += text.slice(pos, h.index) + (SOFT[h.word] ?? "○○"); pos = h.index + h.length; }
  out += text.slice(pos);
  return out.replace(/[ \t]{2,}/g, " ").replace(/[ \t]+\n/g, "\n");
}
function softenDeep(value, words, key) {
  if (key && SKIP_KEYS.has(key)) return value;
  if (typeof value === "string") return softenText(value, words);
  if (Array.isArray(value)) return value.map((v) => softenDeep(v, words));
  if (value && typeof value === "object") return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, softenDeep(v, words, k)]));
  return value;
}
function highlightBanned(text, words) {
  const hits = findBanned(text, words);
  if (!hits.length) return esc(text);
  let out = "", pos = 0;
  for (const h of hits) { out += esc(text.slice(pos, h.index)) + `<mark class="bad">${esc(text.slice(h.index, h.index + h.length))}</mark>`; pos = h.index + h.length; }
  return out + esc(text.slice(pos));
}

/* ---------- 3) AI 호출 (브라우저에서 직접) ---------- */
const PROVIDERS = { claude: "클로드", openai: "오픈AI", gemini: "제미나이" };
const providerKey = (s) => ({ claude: s.claudeKey, openai: s.openaiKey, gemini: s.geminiKey }[s.provider] || "").trim();
const blockedError = (p) => new Error(`${PROVIDERS[p]} 서버에 브라우저에서 직접 연결하지 못했습니다. 제미나이나 클로드로 바꾸거나, 체험 모드를 켜 보세요.`);
async function apiError(res, p) {
  const j = await res.json().catch(() => ({}));
  const e = j.error;
  return new Error((typeof e === "string" ? e : e?.message) || j.message || `${PROVIDERS[p]} 오류 (${res.status})`);
}
async function callClaude(key, system, user, max) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: max, system, messages: [{ role: "user", content: user }] }),
    });
  } catch { throw blockedError("claude"); }
  if (!res.ok) throw await apiError(res, "claude");
  const t = ((await res.json()).content ?? []).map((m) => m.text ?? "").join("").trim();
  if (!t) throw new Error("클로드가 빈 답을 보냈습니다. 한 번 더 눌러 주세요.");
  return t;
}
async function callOpenAI(key, system, user, max) {
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: `Bearer ${key}` },
      body: JSON.stringify({ model: "gpt-4o-mini", temperature: 0.8, max_tokens: max, response_format: { type: "json_object" }, messages: [{ role: "system", content: system }, { role: "user", content: user }] }),
    });
  } catch { throw blockedError("openai"); }
  if (!res.ok) throw await apiError(res, "openai");
  const t = ((await res.json()).choices?.[0]?.message?.content ?? "").trim();

/* SRT 자막: 장면 시간("5-15초")을 그대로 쓴다. 시간이 안 읽히면 장면당 8초. */
function srtTime(sec) {
  const ms = Math.round(sec * 1000), p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`;
}
function buildSrt(scenes) {
  let cursor = 0;
  return scenes.map((sc, i) => {
    const m = /(\d+(?:\.\d+)?)\s*[-~–]\s*(\d+(?:\.\d+)?)/.exec(sc.seconds || sc.time || "");
    let a = m ? Number(m[1]) : cursor, b = m ? Number(m[2]) : cursor + 8;
    if (b <= a) b = a + 8;
    cursor = b;
    return `${i + 1}\n${srtTime(a)} --> ${srtTime(b)}\n${sc.narration}\n`;
  }).join("\n");
}

function ytMessage(status, body) {
  const m = String(body?.error?.message ?? ""), l = m.toLowerCase();
  if (l.includes("quota")) return "오늘 유튜브 무료 검색 한도를 다 썼습니다. 내일 다시 검색해 주세요.";
  if (status === 400 || l.includes("api key")) return "유튜브 키가 맞지 않습니다. 설정 화면을 확인해 주세요.";
  if (status === 403 && l.includes("accessnotconfigured")) return "구글 클라우드에서 YouTube Data API v3를 켜 주세요.";
  if (status === 403) return m || "유튜브가 이 키의 검색을 거절했습니다. 키 제한과 API 사용 설정을 봐 주세요.";
  return m || `유튜브 검색에 실패했습니다. (${status})`;
}
async function ytGet(url) {
  let res; try { res = await fetch(url); } catch { throw new Error("유튜브에 연결하지 못했습니다. 인터넷을 확인해 주세요."); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(ytMessage(res.status, j));
  return j;
}
function isoSeconds(d) {
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(String(d).trim());
  if (!m || (!m[1] && !m[2] && !m[3])) return null;
  return Number(m[1] ?? 0) * 3600 + Number(m[2] ?? 0) * 60 + Number(m[3] ?? 0);
}
async function searchShorts({ key, keyword, period }) {
  key = key.trim(); keyword = keyword.trim();
  if (!key) throw new Error("유튜브 키가 없습니다. 설정에서 키를 넣거나 체험 모드를 켜 주세요.");
  if (!keyword) throw new Error("검색어를 적어 주세요.");
  const now = new Date(), hours = (PERIODS.find((p) => p[0] === period) ?? PERIODS[0])[2];
  const u = new URL("https://www.googleapis.com/youtube/v3/search");
  Object.entries({ part: "snippet", type: "video", videoDuration: "short", regionCode: "KR", relevanceLanguage: "ko", order: "viewCount", maxResults: "15", q: keyword, publishedAfter: new Date(now - hours * 36e5).toISOString(), key }).forEach(([k, v]) => u.searchParams.set(k, v));
  const ids = ((await ytGet(u)).items ?? []).map((i) => i.id?.videoId).filter(Boolean);
  if (!ids.length) return [];
  const vu = new URL("https://www.googleapis.com/youtube/v3/videos");
  vu.searchParams.set("part", "snippet,statistics,contentDetails"); vu.searchParams.set("id", ids.join(",")); vu.searchParams.set("key", key);
  const items = (await ytGet(vu)).items ?? [];
  const chIds = [...new Set(items.map((v) => v.snippet?.channelId).filter(Boolean))], subs = new Map();
  if (chIds.length) {
    const cu = new URL("https://www.googleapis.com/youtube/v3/channels");
    cu.searchParams.set("part", "statistics"); cu.searchParams.set("id", chIds.join(",")); cu.searchParams.set("key", key);
    for (const c of (await ytGet(cu)).items ?? []) subs.set(c.id, c.statistics?.hiddenSubscriberCount ? null : num(c.statistics?.subscriberCount));
  }
  const out = [];
  for (const v of items) {
    const dur = isoSeconds(v.contentDetails?.duration ?? "");
    if (!(dur !== null && dur > 0 && dur <= 60)) continue;
    const ch = v.snippet?.channelId ?? "", th = v.snippet?.thumbnails;
    const base = { id: v.id, example: false, source: "youtube", platformLabel: "유튜브 쇼츠", title: v.snippet?.title ?? "(제목 없음)", channel: v.snippet?.channelTitle ?? "(채널 없음)", channelId: ch, url: `https://www.youtube.com/shorts/${v.id}`, thumbnail: th?.medium?.url || th?.high?.url || th?.default?.url || "", subscribers: subs.get(ch) ?? null, views: num(v.statistics?.viewCount), likes: num(v.statistics?.likeCount), comments: num(v.statistics?.commentCount), publishedAt: v.snippet?.publishedAt ?? now.toISOString(), durationSec: dur, memo: "" };
    out.push({ ...base, ...scoreVideo(base, now) });
  }
  return out;
}

function wrapLines(ctx, text, maxW) {

  ctx.fillStyle = g; ctx.fillRect(0, 0, CARD_W, CARD_H);

    const fade = ctx.createLinearGradient(0, 560, 0, 760); fade.addColorStop(0, "rgba(0,0,0,0)"); fade.addColorStop(1, t.bg); ctx.fillStyle = fade; ctx.fillRect(70, 560, 940, 200);
    y = 760;

  ctx.font = `700 32px ${CANVAS_FONT}`;
  const chip = `${meta.index} / ${meta.total}  ${slide.kicker}`.trim(), cw = Math.min(860, ctx.measureText(chip).width + 48);
  roundRect(ctx, 80, y, cw, 64, 32); ctx.fillStyle = t.chip; ctx.fill(); ctx.fillStyle = t.accent; ctx.fillText(chip, 104, y + 42);
  ctx.fillStyle = t.ink; ctx.font = `700 72px ${CANVAS_FONT}`;
  let ty = y + 150; for (const l of wrapLines(ctx, slide.title, 900).slice(0, 3)) { ctx.fillText(l, 80, ty); ty += 88; }
  ctx.fillStyle = t.muted; ctx.font = `500 40px ${CANVAS_FONT}`; ty += 10;

/* --- 마진 계산기 (셀러 툴킷 자료에서 가져온 도구) --- */
function calcMargin(r) {
  const price = num(r.price), fee = price * num(r.fee) / 100, unit = price - num(r.cost) - num(r.shipping) - fee - num(r.ad) - num(r.misc);
  const denom = 1 - num(r.fee) / 100;
  return { unit, pct: price ? (unit / price) * 100 : 0, total: unit * (num(r.qty) || 1), be: denom > 0 ? (num(r.cost) + num(r.shipping) + num(r.ad) + num(r.misc)) / denom : null };
}
function viewMargin() {
  const cols = [["cost", "원가"], ["price", "판매가"], ["shipping", "배송비"], ["fee", "수수료(%)"], ["ad", "광고비"], ["misc", "기타"], ["qty", "수량"]];
  const rows = state.margin.map((r, i) => { const c = calcMargin(r), cls = c.unit >= 0 ? "pos" : "neg"; return `<tr><td><input type="text" data-bind="margin.${i}.name" data-redraw="1" value="${esc(r.name)}"></td>${cols.map(([k]) => `<td><input type="number" data-bind="margin.${i}.${k}" data-num="1" data-redraw="1" value="${esc(r[k])}"></td>`).join("")}<td class="${cls}">${fmtWon(c.unit)}</td><td class="${cls}">${c.pct.toFixed(1)}%</td><td class="${cls}">${fmtWon(c.total)}</td><td>${c.be === null ? "-" : fmtWon(c.be)}</td><td>${btn("×", "m-del", `data-i="${i}"`, "sec sm")}</td></tr>`; }).join("");
  const sum = state.margin.reduce((a, r) => a + calcMargin(r).total, 0);
  return pageHead("margin", "원가·판매가·수수료·광고비를 넣으면 개당마진, 마진율, 손익분기 판매가가 바로 계산됩니다.") +
    `<div class="card scroll"><table><thead><tr><th>상품명</th>${cols.map(([, l]) => `<th>${l}</th>`).join("")}<th>개당마진</th><th>마진율</th><th>총마진</th><th>손익분기가</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:12px"><b>총마진 합계:</b> <span class="${sum >= 0 ? "pos" : "neg"}">${fmtWon(sum)}</span></p>
    <div class="row" style="margin-top:10px">${btn("행 추가", "m-add", "", "sm")}${btn("CSV로 내보내기 (엑셀에서 열림)", "m-csv", "", "sec sm")}</div></div>
    <p class="small muted">개당마진 = 판매가 − 원가 − 배송비 − 판매가×수수료율 − 광고비 − 기타. 손익분기가 = (원가+배송비+광고비+기타) ÷ (1 − 수수료율).</p>`;
}

/* ---------- 이벤트 ---------- */
async function run(name, fn) {
  ui.busy = name; ui.error = ""; ui.info = ""; render();
  try { await fn(); } catch (e) { ui.error = e instanceof Error ? e.message : "처리하지 못했습니다."; }
  ui.busy = ""; save(); render();
}

});
$("#modeBtn").addEventListener("click", toggleDemo);
/* 입력 칸 → state. 글이 바뀌면 저장만 하고, 표시가 달라져야 하는 칸(data-redraw)만 다시 그린다. */
document.addEventListener("input", (e) => {
  const el = e.target; const path = el.dataset?.bind; if (!path) return;
  setPath(state, path, el.dataset.num ? Number(el.value) : el.value); save();
  if (el.dataset.redraw || path.startsWith("last.") || path.startsWith("drafts.")) {
    const pos = el.selectionStart, id = path; clearTimeout(window.__rd);
    window.__rd = setTimeout(() => { render(); const again = document.querySelector(`[data-bind="${CSS.escape(id)}"]`); if (again && document.activeElement !== again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch { /* 숫자 칸은 선택 범위 없음 */ } } }, 600);
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "card-photos") {
    try {
      const imgs = [];
      for (const file of Array.from(e.target.files).slice(0, 7)) {
        const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error("사진을 읽지 못했습니다.")); r.readAsDataURL(file); });
        imgs.push(await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("사진을 열지 못했습니다.")); im.src = url; }));
      }
      ui.cardPhotos = imgs; ui.error = ""; render();
    } catch (err) { ui.error = err instanceof Error ? err.message : "사진을 올리지 못했습니다."; render(); }
  }
  if (e.target.id === "restore") {
    try {
      const j = JSON.parse(await e.target.files[0].text());
      if (!j || j.version !== 2 || !j.settings) throw new Error();
      state = { ...freshState(), ...j }; ui.videos = null; ui.info = "백업을 불러왔습니다."; save(); render();
    } catch { ui.error = "이 파일은 딸깍 스튜디오 백업이 아닙니다."; render(); }
  }
});
render();
</script>
</body>
</html>
